<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>สงครามอิทธิพล</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;500;700&display=swap">
<style>
/* Layout: noir war room. Square 20x20 board on the left, ledger of rivals, minions and hand on the right; stacks on phones. Single dark look by choice. */
:root{--bg:#12100e;--panel:#1c1915;--line:#352f26;--fg:#ece3d0;--mute:#a09580;--brass:#c9a24d;--blood:#c4553f;--cash:#6dae6a;--wire:#6f93d6;--cellN:#211d18;--display:'Mitr','Sarabun',sans-serif;--body:'Sarabun',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;letter-spacing:.01em;text-wrap:balance}
h1{font-size:clamp(26px,5vw,40px);color:var(--brass)}
h2{font-size:18px;margin-bottom:8px}
h3{font-size:16px}
p{margin:0 0 8px}
.wrap{max-width:1180px;margin:0 auto}
.mute{color:var(--mute)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.btn{font:inherit;background:var(--panel);color:var(--fg);border:1px solid var(--line);padding:8px 14px;border-radius:6px;cursor:pointer;min-height:38px}
.btn:hover:not(:disabled){border-color:var(--brass)}
.btn.on{border-color:var(--brass);background:#2a2418;color:var(--brass)}
.btn.pri{background:var(--brass);color:#1b1408;border-color:var(--brass);font-weight:700}
.btn:disabled{opacity:.4;cursor:default}
input[type=text]{width:100%;background:#0e0c0a;color:var(--fg);border:1px solid var(--line);padding:8px 10px;border-radius:5px;font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:18px}
.seats{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}
.seat{background:var(--panel);border:1px solid var(--line);padding:14px;border-radius:8px;min-width:0;display:grid;gap:10px;align-content:start}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--brass)}
.sw:disabled{opacity:.2;cursor:default}
details{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
summary{cursor:pointer;font-family:var(--display)}
details ul{margin:8px 0 0;padding-left:20px;display:grid;gap:4px}
.layout{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;margin-top:10px}
.boardwrap{flex:0 1 auto;min-width:0;width:min(100%,calc(100svh - 120px))}
.board{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));grid-template-rows:repeat(20,minmax(0,1fr));gap:1px;background:var(--line);width:100%;aspect-ratio:1;border:2px solid var(--line)}
.cell{position:relative;overflow:hidden;min-height:0;background:var(--cellN);display:flex;align-items:center;justify-content:center;font-size:clamp(7px,1.2vw,12px);min-width:0}
.cell.base::after{content:'';position:absolute;inset:14%;border:2px solid rgba(0,0,0,.6);outline:1px solid rgba(255,255,255,.55);pointer-events:none}
.cell.mine{cursor:pointer}
.cell.sel{box-shadow:inset 0 0 0 3px #fff;z-index:2}
.cell.tg{cursor:pointer;box-shadow:inset 0 0 0 2px var(--brass)}
.cell.tg::before{content:'';position:absolute;width:30%;height:30%;border-radius:50%;background:var(--brass);opacity:.9}
.mn{width:80%;max-height:80%;aspect-ratio:1;border-radius:50%;border:2px solid #000;background:var(--c);color:var(--t);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;z-index:1;line-height:1}
.mn.foe{border:2px dashed #fff}
.mn.done{opacity:.55}
.side{flex:1 1 330px;min-width:0;display:grid;gap:14px}
.banner{background:var(--panel);border:1px solid var(--brass);border-radius:8px;padding:10px 14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.pls{display:grid;gap:8px}
.pl{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:4px}
.pl.cur{border-color:var(--brass)}
.pl.dead{opacity:.4}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid #000;margin-right:6px;vertical-align:-1px}
.res{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:12px}
.bar{height:5px;background:#0e0c0a;border-radius:3px;overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;background:var(--k)}
.hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.card{text-align:left;background:#241f19;border:1px solid var(--line);border-top:3px solid var(--brass);padding:8px 10px;border-radius:6px;color:var(--fg);font:inherit;cursor:pointer;display:grid;gap:4px;align-content:start}
.card:disabled{opacity:.4;cursor:default}
.card b{font-family:var(--display);font-weight:500}
.card small{color:var(--mute);line-height:1.35}
.cost{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.chip{padding:0 6px;border-radius:10px;background:#0e0c0a;border:1px solid var(--line)}
.ml{display:grid;gap:6px}
.mrow{display:flex;justify-content:space-between;gap:8px;text-align:left;width:100%}
.log{font-size:13px;color:var(--mute);max-height:150px;overflow:auto;display:grid;gap:2px}
#modal{position:fixed;inset:0;background:rgba(5,4,3,.8);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
#modal.solid{background:var(--bg)}
.sheet{background:var(--panel);border:1px solid var(--brass);border-radius:10px;padding:20px;max-width:460px;width:100%;max-height:90svh;overflow:auto;display:grid;gap:12px}
.acts{display:grid;gap:8px}
.acts .btn{text-align:left}
.acts small{display:block;color:var(--mute)}
@media (prefers-reduced-motion:no-preference){.cell.sel{transition:box-shadow .15s}}
.hero{font-size:clamp(34px,8vw,64px);line-height:1.1}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.tile{font:inherit;text-align:left;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px;cursor:pointer;display:grid;gap:6px;min-height:140px;align-content:end;min-width:0}
.tile b{font-family:var(--display);font-weight:500;font-size:22px}
.tile span{color:var(--mute);font-size:14px}
.tile:hover{border-color:var(--brass)}
.tile.pri{background:var(--brass);color:#1b1408;border-color:var(--brass)}
.tile.pri span{color:#3a2d0f}
.doc{max-width:70ch;display:grid;gap:18px}
.doc section{display:grid;gap:6px}
.doc ul{margin:0;padding-left:20px;display:grid;gap:4px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.cx{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--brass);border-radius:6px;padding:12px;display:grid;gap:6px;align-content:start;min-width:0}
.cx b{font-family:var(--display);font-weight:500}
.tag{font-size:12px;color:var(--mute);letter-spacing:.04em}
.bframe{display:grid;grid-template-columns:18px minmax(0,1fr);grid-template-rows:16px auto;gap:2px}
.axis{display:grid;font-size:10px;color:var(--mute);text-align:center;align-items:center;min-width:0;font-variant-numeric:tabular-nums}
.axis.ax{grid-template-columns:repeat(20,minmax(0,1fr))}
.axis.ay{grid-template-rows:repeat(20,minmax(0,1fr))}

const NAMES=['เสี่ยหมู','ไอ้แมว','ตาเหลือก','เฮียตง','แม่นกยูง','ลุงเหล็ก','อาตี๋','จ่าเสือ','พี่บอส','เจ๊ฝอย','ปู่ดำ','น้าเขี้ยว','หนุ่มเงา','เด็กสอง','ไอ้เกลียว','มือปืนจิ๋ว','ตี๋ใหญ่','ป๋าเพชร','ลูกชายเสือ','พญาไฟ','เสือโหด','เก่งกาจ','มังกรเขียว','ไอ้หนวด'];
let G=null,FAST=false;
const sleep=ms=>FAST?Promise.resolve():new Promise(r=>setTimeout(r,ms));
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const clip=s=>Array.from(String(s||'').trim()).slice(0,14).join('');
const xy=i=>[i%N,Math.floor(i/N)];
const nbrs=i=>{const[x,y]=xy(i),r=[];if(y>0)r.push(i-N);if(x>0)r.push(i-1);if(x<N-1)r.push(i+1);if(y<N-1)r.push(i+N);return r};
const dist=(a,b)=>{const[p,q]=xy(a),[r,s]=xy(b);return Math.abs(p-r)+Math.abs(q-s)};
const allies=(a,b)=>a===b||G.players[a].team===G.players[b].team;
const mine=p=>G.minions.filter(m=>m.owner===p.id);
const canPay=(p,c)=>RK.every(k=>(c[k]||0)<=p.res[k]);
const addRes=(p,g)=>RK.forEach(k=>p.res[k]+=g[k]||0);
const payRes=(p,c)=>RK.forEach(k=>p.res[k]-=c[k]||0);
const need=m=>Math.max(1,m.lvl+1-(G.players[m.owner].boss==='tiger'?1:0));
const log=t=>{G.log.unshift(t);if(G.log.length>40)G.log.pop()};
const terr=p=>G.cells.filter(c=>c.o===p.id).length;
const botName=()=>NAMES[rnd(NAMES.length)];

function buildDeck(){const d=[];CARDS.forEach(c=>{for(let i=0;i<c.k*2;i++)d.push(c)});return shuffle(d)}
function draw(p,n){for(let i=0;i<n;i++){if(!G.deck.length){G.deck=shuffle(G.discard);G.discard=[]}if(!G.deck.length)return;p.hand.push(G.deck.pop())}}
function addMinion(p,name,pos){const m={id:G.mid++,name:clip(name)||botName(),owner:p.id,pos,lvl:1,wins:0,moved:false};G.minions.push(m);return m}
function initGame(cfg){
 const corners=cfg.seats.length===2?[0,N*N-1]:[0,N-1,N*(N-1),N*N-1];
 const teams=cfg.mode==='2v2'?[0,1,1,0]:cfg.seats.map((_,i)=>i);
 G={players:[],cells:Array.from({length:N*N},()=>({o:-1,b:-1})),minions:[],deck:buildDeck(),discard:[],log:[],turn:0,round:1,over:null,viewer:-1,actor:-1,scout:-1,busy:false,sel:null,mid:1,mode:cfg.mode,humans:0,endTurn:null};
 cfg.seats.forEach((s,i)=>{
  const p={id:i,name:s.name,type:s.type,color:s.color,boss:s.boss,team:teams[i],base:corners[i],res:{m:5,w:5,c:5},hand:[],alive:true};
  G.players.push(p);G.cells[p.base]={o:i,b:i};addMinion(p,s.mname,p.base);draw(p,5);
  if(s.type==='human')G.humans++;
 });
}
function spawnPos(p){let best=-1,bd=1e9;G.cells.forEach((c,i)=>{if(c.o===p.id&&!G.minions.some(m=>m.pos===i)){const d=dist(i,p.base);if(d<bd){bd=d;best=i}}});return best}
function claim(i,owner){const c=G.cells[i];if(c.b>=0||c.o===owner||(c.o>=0&&allies(c.o,owner)))return;c.o=owner}
function grab(p,n){let got=0;for(let t=0;t<n;t++){const c=[];G.cells.forEach((cl,i)=>{if(cl.b<0&&cl.o!==p.id&&!(cl.o>=0&&allies(cl.o,p.id))&&!G.minions.some(m=>m.pos===i)&&nbrs(i).some(j=>G.cells[j].o===p.id))c.push(i)});if(!c.length)break;G.cells[c[rnd(c.length)]].o=p.id;got++}return got}
function income(p){const n=Math.floor(terr(p)/INC),g={m:n,w:n,c:n};if(p.boss==='banker')g.w++;if(p.boss==='chief')g.m++;if(p.boss==='fixer')g.c++;addRes(p,g);return g}
function gainWin(m){m.wins++;if(m.lvl<5&&m.wins>=need(m)){m.lvl++;m.wins=0;return' และอัปเป็นเลเวล '+m.lvl}return''}

function encircled(p){const ns=nbrs(p.base);return ns.every(i=>G.minions.some(m=>m.pos===i&&!allies(m.owner,p.id)))}
function eliminate(p){
 p.alive=false;G.minions=G.minions.filter(m=>m.owner!==p.id);
 G.cells.forEach(c=>{if(c.o===p.id){c.o=-1;c.b=-1}});
 log(p.name+' ถูกล้อมฐานจนไม่มีทางออก ตกรอบ!');
}
function endGame(team,reason){G.over={team,reason};if(G.endTurn)G.endTurn()}
function checkEnd(){
 if(G.over)return;
 G.players.forEach(p=>{if(p.alive&&encircled(p))eliminate(p)});
 const alive=G.players.filter(p=>p.alive);
 if(new Set(alive.map(p=>p.team)).size<=1){endGame(alive.length?alive[0].team:-1,'เหลือฝั่งเดียวบนกระดาน');return}
 const w=alive.find(p=>RK.every(k=>p.res[k]>=100));
 if(w)endGame(w.team,w.name+' สะสมทรัพยากรครบอย่างละ 100');
}
function fleeSpots(d){return shuffle(nbrs(d.pos).filter(i=>!G.minions.some(x=>x.pos===i))).sort((p,q)=>(G.cells[q].o===d.owner)-(G.cells[p].o===d.owner))}

async function doMove(m,to){
 const from=m.pos;m.moved=true;
 const t=G.minions.find(x=>x.pos===to&&!allies(x.owner,m.owner));
 if(!t){m.pos=to;claim(to,m.owner)}else await clash(m,t,from,to);
 checkEnd();
}
async function clash(a,d,from,to){
 const A=G.players[a.owner],D=G.players[d.owner],cell=G.cells[to];
 const flee=fleeSpots(d);
 const cA=await decide(A,a,d,true),cD=await decide(D,d,a,flee.length>0);
 const nm=(m)=>'<b>'+esc(m.name)+'</b> ('+esc(G.players[m.owner].name)+' เลเวล '+m.lvl+')';
 let txt='';
 if(cA==='flee'&&cD==='flee'){
  a.pos=from;d.pos=flee[0];if(cell.b<0)cell.o=-1;
  txt='ทั้งสองฝ่ายถอย ช่องนั้นกลายเป็นอิทธิพลว่าง';
 }else if(cA==='flee'){
  a.pos=from;const oc=G.cells[from];
  if(A.boss!=='nerve'&&oc.b<0)oc.o=-1;
  txt=nm(a)+' ถอยหนี'+(A.boss==='nerve'?' (ใจเด็ด ไม่เสียพื้นที่)':' และเสียช่องที่เคยยืน');
 }else if(cD==='flee'){
  d.pos=flee[0];a.pos=to;
  if(D.boss!=='nerve'&&cell.b<0)cell.o=a.owner;
  txt=nm(d)+' ถอยหนี'+(D.boss==='nerve'?' (ใจเด็ด ไม่เสียพื้นที่)':' และเสียช่องนั้นให้ฝ่ายบุก');
 }else{
  let aw,how;
  if(a.lvl!==d.lvl){aw=a.lvl>d.lvl;how='เลเวลสูงกว่าชนะทันที'}
  else{const r=await rps(A,D);aw=r.aw;how='เป่ายิงฉุบ '+r.t}
  const w=aw?a:d,l=aw?d:a;
  G.minions=G.minions.filter(x=>x!==l);
  w.pos=to;claim(to,w.owner);
  txt=how+'<br>'+nm(w)+' ชนะ '+nm(l)+esc(gainWin(w));
 }
 await notice([A,D],'ผลการปะทะ',txt);
}
/* ---------- modal helpers ---------- */
function modal(html,solid){
 return new Promise(res=>{
  const m=$('modal');m.className=solid?'solid':'';m.innerHTML='<div class="sheet">'+html+'</div>';m.hidden=false;
  m.onclick=e=>{
   const b=e.target.closest('[data-v]');if(!b||b.disabled)return;
   const inp=m.querySelector('input');const out={v:b.dataset.v,t:inp?inp.value:''};
   m.hidden=true;m.innerHTML='';m.onclick=null;res(out);
  };
  const i=m.querySelector('input');if(i)i.focus();
 });
}
const btn=(l,v,o={})=>'<button class="btn'+(o.pri?' pri':'')+'" data-v="'+esc(v)+'"'+(o.dis?' disabled':'')+'>'+l+(o.sub?'<small>'+o.sub+'</small>':'')+'</button>';
const sheet=(t,b,a)=>'<h3>'+t+'</h3><div>'+b+'</div><div class="acts">'+a+'</div>';
async function pickList(title,items,cancel=true){
 const r=await modal(sheet(title,'',items.map(x=>btn(x.l,x.v,{sub:x.d,dis:x.dis})).join('')+(cancel?btn('ยกเลิก','__x'):'')));
 return r.v==='__x'?null:r.v;
}
async function askName(title,def){
 const r=await modal(sheet(title,'<input type="text" id="nm" maxlength="14" value="'+esc(def)+'" aria-label="ชื่อลูกน้อง"><p class="mute" style="margin-top:6px">ไม่เกิน 14 ตัวอักษร</p>',btn('ตั้งชื่อ','ok',{pri:1})));
 return clip(r.t)||def;
}
async function ensureViewer(p){
 if(p.type!=='human')return;
 if(G.humans>1&&G.viewer!==p.id){
  G.viewer=-1;render();
  await modal(sheet('ส่งเครื่องให้ '+esc(p.name),'<p>ผู้เล่นคนอื่นห้ามมอง กดปุ่มเมื่อ <b>'+esc(p.name)+'</b> พร้อมแล้ว</p>',btn('ฉันคือ '+esc(p.name),'ok',{pri:1})),true);
 }
 G.viewer=p.id;render();
}
async function notice(list,title,body){
 for(const p of [...new Set(list)]){
  if(p.type!=='human')continue;
  await ensureViewer(p);
  await modal(sheet(title,body,btn('ตกลง','ok',{pri:1})));
 }
 if(G.actor>=0)await ensureViewer(G.players[G.actor]);
}
async function decide(P,m,o,canFlee){
 if(P.type==='bot')return botClash(m,o,canFlee);
 await ensureViewer(P);
 const O=G.players[o.owner];
 const r=await modal(sheet('ปะทะ!','<p>ลูกน้องของคุณ <b>'+esc(m.name)+'</b> (เลเวล '+m.lvl+') เจอ <b>'+esc(o.name)+'</b> เลเวล '+o.lvl+' ของ '+esc(O.name)+'</p><p class="mute">สู้: เลเวลสูงกว่าชนะทันที ถ้าเท่ากันเป่ายิงฉุบ ผู้แพ้เสียลูกน้อง<br>หนี: ฝ่ายที่หนีเสียพื้นที่ที่เคยยืน'+(canFlee?'':'<br>(ไม่มีช่องว่างให้หนี ต้องสู้)')+'</p>',btn('สู้','fight',{pri:1})+btn('หนี','flee',{dis:!canFlee})));
 return r.v;
}
const RPS=['ค้อน','กระดาษ','กรรไกร'];
async function rps(A,D){
 let t=[];
 for(;;){
  const pk=async P=>{if(P.type==='bot')return rnd(3);await ensureViewer(P);const r=await modal(sheet('เป่ายิงฉุบ','<p>'+esc(P.name)+' เลือกท่าของคุณ</p>',RPS.map((x,i)=>btn(x,i)).join('')));return+r.v};
  const a=await pk(A),d=await pk(D);
  t.push(RPS[a]+' ชน '+RPS[d]);
  if(a===d){t[t.length-1]+=' (เสมอ เป่าใหม่)';continue}
  return{aw:(a-d+3)%3===1,t:t.join(' / ')};
 }
}

/* ---------- rendering ---------- */
const tint=(h,a)=>{const n=parseInt(h.slice(1),16);return'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a+')'};
const txtCol=h=>{const n=parseInt(h.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;return(r*299+g*587+b*114)/1000>140?'#111':'#fff'};
function visible(v){
 const mineSet=new Map(),foe=new Set();
 if(!v)return{mineSet,foe};
 G.minions.forEach(m=>{if(allies(m.owner,v.id))mineSet.set(m.pos,m)});
 const hawk=v.boss==='hawk'?mine(v):[];
 G.minions.forEach(m=>{if(allies(m.owner,v.id))return;
  if(G.scout===v.id||hawk.some(x=>nbrs(x.pos).includes(m.pos)))foe.add(m.pos)});
 return{mineSet,foe};
}
function targets(v){
 if(!v||G.actor!==v.id||G.sel==null)return[];
 const m=G.minions.find(x=>x.id===G.sel);
 if(!m||m.moved||m.owner!==v.id)return[];
 return nbrs(m.pos).filter(i=>!G.minions.some(x=>x.pos===i&&allies(x.owner,v.id)));
}
function render(){
 if(!G)return;
 const v=G.viewer>=0?G.players[G.viewer]:null;
 const{mineSet,foe}=visible(v),tg=new Set(targets(v));
 const selM=G.sel!=null?G.minions.find(x=>x.id===G.sel):null;
 let h='';
 for(let i=0;i<N*N;i++){
  const c=G.cells[i],o=c.o>=0?G.players[c.o]:null,m=mineSet.get(i);
  let cls='cell'+(c.b>=0?' base':'')+(tg.has(i)?' tg':'')+(selM&&selM.pos===i?' sel':'')+(o?' own':'');
  if(m&&m.owner===(v&&v.id)&&!m.moved&&G.actor===(v&&v.id))cls+=' mine';
  let inner='';
  if(m){const pc=COLORS[G.players[m.owner].color].h;inner='<i class="mn'+(m.moved&&m.owner===G.actor?' done':'')+'" style="--c:'+pc+';--t:'+txtCol(pc)+'">'+m.lvl+'</i>'}
  else if(foe.has(i)){const mm=G.minions.find(x=>x.pos===i),pc=COLORS[G.players[mm.owner].color].h;inner='<i class="mn foe" style="--c:'+pc+';--t:'+txtCol(pc)+'">?</i>'}
  h+='<div class="'+cls+'" data-i="'+i+'"'+(o?' style="background:'+tint(COLORS[o.color].h,c.b>=0?.92:.6)+'"':'')+'>'+inner+'</div>';
 }
 $('board').innerHTML=h;
 renderSide(v);
}
function resBlock(p,big){
 return'<div class="res">'+RK.map(k=>'<div><span style="color:'+RC[k]+'">'+RN[k]+'</span> <b>'+p.res[k]+'</b>/100<div class="bar"><i style="--k:'+RC[k]+';width:'+Math.min(100,p.res[k])+'%"></i></div></div>').join('')+'</div>';
}
function renderSide(v){
 const cur=G.players[G.turn],bo=id=>BOSSES.find(b=>b.id===id).n;
 let h='<div class="banner"><div><b>รอบที่ '+G.round+'</b> · ตาของ <span class="dot" style="background:'+COLORS[cur.color].h+'"></span><b>'+esc(cur.name)+'</b>'+(cur.type==='bot'?' (บอท)':'')+'</div>'+
  (v&&G.actor===v.id?'<button class="btn pri" data-act="end"'+(G.busy?' disabled':'')+'>จบเทิร์น</button>':'')+'</div>';
 h+='<div class="pls">'+G.players.map(p=>'<div class="pl'+(p.id===G.turn?' cur':'')+(p.alive?'':' dead')+'"><div class="row" style="justify-content:space-between"><span><span class="dot" style="background:'+COLORS[p.color].h+'"></span><b>'+esc(p.name)+'</b> <span class="mute">'+bo(p.boss)+(G.mode==='2v2'?' · ทีม '+(p.team?'ข':'ก'):'')+'</span></span><span class="mute">'+(p.alive?'พื้นที่ '+terr(p)+' ช่อง (รายได้ +'+Math.floor(terr(p)/INC)+')':'ตกรอบ')+'</span></div>'+resBlock(p)+'</div>').join('')+'</div>';
 if(v&&v.alive){
  h+='<div><h2>ลูกน้องของ '+esc(v.name)+'</h2><div class="ml">'+mine(v).map(m=>'<button class="btn mrow'+(G.sel===m.id?' on':'')+'" data-act="sel" data-id="'+m.id+'"'+(G.actor!==v.id||m.moved?' disabled':'')+'><span>'+esc(m.name)+' · '+coord(m.pos)+' · เลเวล '+m.lvl+(m.lvl<5?' ('+m.wins+'/'+need(m)+')':' สูงสุด')+'</span><span class="mute">'+(m.moved?'เดินแล้ว':'พร้อมเดิน')+'</span></button>').join('')+'</div></div>';
  h+='<div><h2>การ์ดในมือ ('+v.hand.length+')</h2><div class="hand">'+(v.hand.length?v.hand.map((c,i)=>'<button class="card" data-act="card" data-i="'+i+'"'+(G.actor!==v.id||G.busy||!canPay(v,c.cost)?' disabled':'')+'><b>'+c.n+'</b><span class="cost">'+RK.filter(k=>c.cost[k]).map(k=>'<span class="chip" style="color:'+RC[k]+'">'+RN[k]+' '+c.cost[k]+'</span>').join('')+'</span><small>'+c.d+'</small></button>').join(''):'<span class="mute">ไม่มีการ์ด</span>')+'</div></div>';
 }
 h+='<div><h2>บันทึกเหตุการณ์</h2><div class="log">'+G.log.slice(0,14).map(t=>'<div>'+esc(t)+'</div>').join('')+'</div></div>';
 $('side').innerHTML=h;

function bindGame(){
 $('board').onclick=async e=>{
  const c=e.target.closest('.cell');if(!c||!G||G.busy||G.actor<0)return;
  const v=G.players[G.actor];if(G.viewer!==v.id||v.type!=='human')return;
  const i=+c.dataset.i,m=G.minions.find(x=>x.pos===i&&x.owner===v.id);
  if(m&&!m.moved){G.sel=m.id;render();return}
  if(G.sel!=null&&targets(v).includes(i)){
   const sm=G.minions.find(x=>x.id===G.sel);G.busy=true;G.sel=null;render();
   await doMove(sm,i);G.busy=false;render();
  }
 };
 $('side').onclick=async e=>{
  const b=e.target.closest('[data-act]');if(!b||!G||G.busy||G.actor<0)return;
  const v=G.players[G.actor];if(G.viewer!==v.id)return;
  if(b.dataset.act==='end'){G.endTurn&&G.endTurn();return}
  if(b.dataset.act==='sel'){G.sel=+b.dataset.id;render();return}
  if(b.dataset.act==='card'){G.busy=true;render();await playCard(v,+b.dataset.i,false);G.busy=false;checkEnd();render()}
 };
}
/* ---------- cards ---------- */
async function playCard(p,idx,bot){
 const c=p.hand[idx];if(!c||!canPay(p,c.cost))return false;
 const foes=G.players.filter(q=>q.alive&&!allies(q.id,p.id));
 let tgt=null,res=null,names=[];
 if(c.t==='lvl'){
  const ms=mine(p).filter(m=>m.lvl<5);
  if(!ms.length){if(!bot)await modal(sheet('ใช้ไม่ได้','ลูกน้องทุกคนเลเวลสูงสุดแล้ว',btn('ตกลง','ok')));return false}
  if(bot)tgt=ms.sort((a,b)=>b.lvl-a.lvl)[0];
  else{const v=await pickList('เลือกลูกน้องที่จะฝึก',ms.map(m=>({l:esc(m.name),v:m.id,d:'เลเวล '+m.lvl})));if(v==null)return false;tgt=ms.find(m=>m.id===+v)}
 }
 if(c.t==='steal'){
  if(!foes.length)return false;
  if(bot){tgt=foes.sort((a,b)=>Math.max(...RK.map(k=>b.res[k]))-Math.max(...RK.map(k=>a.res[k])))[0];res=RK.slice().sort((a,b)=>tgt.res[b]-tgt.res[a])[0]}
  else{
   const v=await pickList('เลือกคู่แข่งที่จะปล้น',foes.map(q=>({l:esc(q.name),v:q.id})));if(v==null)return false;
   tgt=G.players[+v];
   const r=await pickList('ชิงทรัพยากรชนิดไหน',RK.map(k=>({l:RN[k],v:k,d:'ของ '+esc(tgt.name)+' มี '+tgt.res[k]})));if(r==null)return false;res=r;
  }
 }
 if(c.t==='spawn'){
  for(let i=0;i<c.v;i++){
   if(bot)names.push(botName());
   else{const n=await askName('ตั้งชื่อลูกน้องคนที่ '+(i+1)+' จาก '+c.v,NAMES[rnd(NAMES.length)]);names.push(n)}
  }
 }
 payRes(p,c.cost);
 p.hand.splice(idx,1);G.discard.push(c);
 let note='';
 if(c.t==='spawn'){names.forEach(n=>{const pos=spawnPos(p);if(pos>=0)addMinion(p,n,pos)})}
 else if(c.t==='lvl'){tgt.lvl=Math.min(5,tgt.lvl+1);tgt.wins=0;note=' (ฝึก '+tgt.name+')'}
 else if(c.t==='gain')addRes(p,c.g);
 else if(c.t==='steal'){const a=Math.min(4,tgt.res[res]);tgt.res[res]-=a;p.res[res]+=a;note=' (ชิง '+RN[res]+' '+a+' จาก '+tgt.name+')'}
 else if(c.t==='grab'){grab(p,c.v)}
 else if(c.t==='scout'){G.scout=p.id}
 else if(c.t==='draw')draw(p,c.v);
 log(p.name+' เล่นการ์ด '+c.n+note);
 checkEnd();
 return true;
}

/* ---------- bots ---------- */
function botClash(m,o,canFlee){
 if(!canFlee)return'fight';
 if(o.lvl>m.lvl)return'flee';
 if(o.lvl===m.lvl)return Math.random()<.25?'flee':'fight';
 return'fight';
}
function botPickCard(p){
 const low=RK.slice().sort((a,b)=>p.res[a]-p.res[b])[0];
 const ms=mine(p),foes=G.players.filter(q=>q.alive&&!allies(q.id,p.id));
 let best=-1,bs=3;
 p.hand.forEach((c,i)=>{
  if(!canPay(p,c.cost))return;
  let s=0;
  if(c.t==='spawn')s=ms.length<7?(c.v===2?9:8):2;
  else if(c.t==='lvl')s=ms.some(m=>m.lvl<5)?6:0;
  else if(c.t==='grab')s=5;
  else if(c.t==='gain'){const gs=RK.reduce((a,k)=>a+(c.g[k]||0),0),cs=RK.reduce((a,k)=>a+(c.cost[k]||0),0);s=2+(c.g[low]?2:0)-(c.cost[low]?3:0)+(gs>cs?1:0)}
  else if(c.t==='draw')s=p.hand.length<=5?3.5:0;
  else if(c.t==='steal')s=foes.some(q=>RK.some(k=>q.res[k]>=4))?4:0;
  s+=Math.random()*.5;
  if(s>bs){bs=s;best=i}
 });
 return best;
}
function botMove(p,m){
 const enemies=G.players.filter(q=>q.alive&&!allies(q.id,p.id));
 const goal=enemies.length?enemies.slice().sort((a,b)=>dist(m.pos,a.base)-dist(m.pos,b.base))[0].base:p.base;
 const ebase=new Set(enemies.map(q=>q.base));
 const cand=nbrs(m.pos).filter(i=>!G.minions.some(x=>x.pos===i&&allies(x.owner,p.id)));
 if(!cand.length)return null;
 let best=cand[0],bs=-1e9;
 cand.forEach(i=>{
  const o=G.cells[i].o;let s=Math.random()*1.6;
  if(o<0)s+=3;else if(!allies(o,p.id))s+=4;else s+=.3;
  const aggr=.35+m.lvl*.12+(m.id%2?.3:0);
  s+=(dist(m.pos,goal)-dist(i,goal))*aggr;
  if(nbrs(i).some(j=>ebase.has(j))&&dist(i,goal)<=2)s+=2.5;
  if(s>bs){bs=s;best=i}
 });
 return best;
}
async function botTurn(p){
 await sleep(500);
 for(let k=0;k<8&&!G.over;k++){
  const i=botPickCard(p);if(i<0)break;
  if(!await playCard(p,i,true))break;
  render();await sleep(450);
 }
 const ms=shuffle(mine(p).filter(m=>!m.moved));
 for(const m of ms){
  if(G.over)return;
  if(!G.minions.includes(m))continue;
  const to=botMove(p,m);if(to==null)continue;
  await doMove(m,to);render();await sleep(220);
 }
}

/* ---------- turn flow ---------- */
function discardTo6(p){
 while(p.hand.length>6){
  const i=p.hand.map((c,j)=>[RK.reduce((a,k)=>a+(c.cost[k]||0),0),j]).sort((a,b)=>a[0]-b[0])[0][1];
  G.discard.push(p.hand.splice(i,1)[0]);
 }
}
async function takeTurn(p){
 G.actor=-1;G.scout=-1;G.sel=null;
 mine(p).forEach(m=>m.moved=false);
 draw(p,1);
 log('ตาของ '+p.name);
 if(p.type==='human'){
  await ensureViewer(p);
  while(p.hand.length>6){
   const v=await pickList('มือเกิน 6 ใบ เลือกการ์ดที่จะทิ้ง',p.hand.map((c,i)=>({l:c.n,v:i,d:c.d})),false);
   G.discard.push(p.hand.splice(+v,1)[0]);
  }
  G.actor=p.id;render();
  await new Promise(r=>{G.endTurn=r});
  G.endTurn=null;G.actor=-1;G.sel=null;
 }else{
  discardTo6(p);render();
  await botTurn(p);
 }
 if(G.over)return;
 G.scout=-1;
 const g=income(p);
 log(p.name+' จบเทิร์น ได้ '+RN.m+' +'+g.m+' '+RN.w+' +'+g.w+' '+RN.c+' +'+g.c);
 checkEnd();render();
}
async function run(){
 while(!G.over){
  const p=G.players[G.turn];
  if(p.alive)await takeTurn(p);
  if(G.over)break;
  const prev=G.turn;
  do{G.turn=(G.turn+1)%G.players.length}while(!G.players[G.turn].alive);
  if(G.turn<=prev)G.round++;
  render();
 }
}
async function startGame(cfg){
 initGame(cfg);
 if(G.humans===1)G.viewer=G.players.find(p=>p.type==='human').id;
 $('setup').hidden=true;$('game').hidden=false;
 render();
 const g=G;
 await run();
 if(G!==g)return;
 const ws=G.players.filter(p=>p.team===G.over.team);
 G.viewer=G.viewer>=0?G.viewer:0;render();
 await modal(sheet('จบเกม','<p>ผู้ชนะ: <b>'+(ws.length?ws.map(p=>esc(p.name)).join(' และ '):'ไม่มี')+'</b></p><p class="mute">'+esc(G.over.reason)+'</p>',btn('กลับไปหน้าตั้งค่า','ok',{pri:1})));

}
